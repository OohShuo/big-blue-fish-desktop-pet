name: Commit attribution
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  attribution:
    name: No Claude attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .githooks/check-attribution.py --self-test
      - run: python .githooks/check-attribution.py HEAD
